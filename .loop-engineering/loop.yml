objective: "Audit HLP-001 safe_write and HLP-004 CLI parsing; preserve boundary, overwrite, and capability policy where no native contract is equivalent."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check server.kujo >/dev/null && /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check mcp.kujo >/dev/null && find src tests -name '*.kujo' -exec /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check {} \;"
  - id: regression_tests
    command: "KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/test_01_unit_harness.sh && KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/test_02_security_regression_suite.sh"
  - id: diff_check
    command: 'files=$(git diff --name-only | grep -v "^.loop-engineering/" || true); if [ -n "$files" ]; then git diff --check -- $files; fi'
  - id: diff_check
    command: "git diff --check"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
