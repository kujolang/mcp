<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: #f2f2ed;
        background:
          radial-gradient(circle at 50% 42%, rgba(228, 204, 255, 0.055), transparent 43%),
          #060706;
      }
      #root::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.13;
        background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 100% 6px;
        pointer-events: none;
      }
      .rail {
        position: absolute;
        left: 42px;
        right: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #92968f;
        font: 18px/1 "Departure Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .rail.top { top: 25px; }
      .signal { color: #e4ccff; }
      .intro {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .intro-kicker {
        color: #e4ccff;
        font: 22px/1 "Departure Mono", monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .intro-title {
        margin-top: 24px;
        font: 92px/0.95 "Departure Mono", monospace;
        letter-spacing: -0.055em;
      }
      .intro-route {
        margin-top: 30px;
        color: #a3a7a0;
        font: 21px/1.35 "Departure Mono", monospace;
        letter-spacing: 0.04em;
      }
      .screen-shell {
        position: absolute;
        left: 140px;
        top: 68px;
        width: 1640px;
        height: 988px;
        overflow: hidden;
        background: #101719;
        border: 1px solid rgba(228, 204, 255, 0.62);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 28px 90px rgba(0,0,0,0.7);
      }
      .screen-shell video,
      .screen-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .live-badge {
        position: absolute;
        top: 84px;
        right: 158px;
        padding: 11px 15px 10px;
        color: #070806;
        background: #e4ccff;
        font: 17px/1 "Departure Mono", monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        z-index: 4;
      }
      .proof-badge {
        position: absolute;
        right: 158px;
        bottom: 42px;
        padding: 13px 17px 12px;
        color: #e4ccff;
        background: rgba(6, 7, 6, 0.94);
        border: 1px solid rgba(228, 204, 255, 0.65);
        font: 18px/1 "Departure Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        z-index: 4;
      }
      .end-card {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 48%, rgba(140, 78, 221, 0.19), transparent 40%),
          #060706;
      }
      .brand-lockup {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr);
        align-items: center;
        width: 1640px;
      }
      .command-code-wordmark {
        width: 680px;
        height: auto;
        justify-self: start;
      }
      .crossover-x {
        width: 100%;
        text-align: center;
        justify-self: stretch;
        color: #e4ccff;
        font: 78px/1 "Departure Mono", monospace;
      }
      .kujo-brand {
        display: flex;
        align-items: center;
        gap: 38px;
        justify-self: end;
      }
      .kujo-mark {
        position: relative;
        width: 190px;
        height: 190px;
        background: #ffffff;
      }
      .kujo-mark::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #e4ccff;
        -webkit-mask: url(".media/images/logo_002.svg") center / contain no-repeat;
        mask: url(".media/images/logo_002.svg") center / contain no-repeat;
      }
      .kujo-wordmark {
        color: #f2f2ed;
        font: 138px/1 "Departure Mono", monospace;
        letter-spacing: -0.075em;
      }
      .end-link {
        position: absolute;
        bottom: 76px;
        left: 50%;
        transform: translateX(-50%);
        color: #e4ccff;
        font: 25px/1 "Departure Mono", monospace;
        letter-spacing: 0.12em;
        text-transform: lowercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="command-code-live" data-width="1920" data-height="1080" data-duration="26">
      <div id="live-intro" class="clip intro" data-start="0" data-duration="1.75" data-track-index="1">
        <div class="intro-kicker">Actual host session · recorded live</div>
        <div class="intro-title">COMMAND CODE × KUJO</div>
        <div class="intro-route">OLLAMA GLM 5.3 → MCP → ABILITY GATEWAY → KUJO</div>
      </div>

      <div id="live-shell" class="screen-shell">
        <video
          id="command-code-live-session"
          class="clip"
          src="assets/command-code-live.mp4"
          data-start="1.75"
          data-duration="18.47"
          data-track-index="2"
          muted
          playsinline
        ></video>
      </div>

      <div id="final-shell" class="clip screen-shell" data-start="20.22" data-duration="1.28" data-track-index="3">
        <img src="assets/command-code-live-final.png" alt="Final Command Code response showing a verified Kujo receipt" />
      </div>

      <div id="live-badge" class="clip live-badge" data-start="1.75" data-duration="18.47" data-track-index="4">Live Command Code</div>
      <div id="proof-badge" class="clip proof-badge" data-start="20.22" data-duration="1.28" data-track-index="5">npm 0.1.0 · receipt verified</div>
      <audio
        id="command-code-narration"
        src="assets/narration-brian-normalized.wav"
        data-start="0.25"
        data-duration="21.083729"
        data-track-index="6"
        data-volume="0.74"
      ></audio>
      <div id="proof-rail" class="clip rail top" data-start="0" data-duration="21.5" data-track-index="7"><span>@kujolang/kujo-cmd · public package proof</span><span class="signal">0.1.0 / Live</span></div>

      <section id="end-card" class="clip end-card" data-start="21.5" data-duration="4.5" data-track-index="8">
        <div class="brand-lockup">
          <div id="kujo-brand" class="kujo-brand">
            <div class="kujo-mark" role="img" aria-label="Kujo logomark"></div>
            <div class="kujo-wordmark">Kujo</div>
          </div>
          <div id="crossover-x" class="crossover-x">×</div>
          <img id="command-code-wordmark" class="command-code-wordmark" src=".media/images/logo_001.svg" alt="Command Code" />
        </div>
        <div id="end-link" class="end-link">kujolang.ai</div>
      </section>
    </div>
    <script>
      window.__timelines["command-code-live"] = gsap.timeline({ paused: true })
        .fromTo("#live-shell", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.75)
        .fromTo("#live-badge", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.95)
        .fromTo("#proof-badge", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 20.22)
        .fromTo("#end-card", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 21.5)
        .fromTo("#kujo-brand", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 21.64)
        .fromTo("#crossover-x", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, 21.86)
        .fromTo("#command-code-wordmark", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 21.78)
        .fromTo("#end-link", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 22.22);
    </script>
  </body>
</html>
