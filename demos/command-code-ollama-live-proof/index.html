<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: #f2f2ed;
        background:
          radial-gradient(circle at 50% 42%, rgba(228, 204, 255, 0.055), transparent 43%),
          #060706;
      }
      #root::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.13;
        background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 100% 6px;
        pointer-events: none;
      }
      .rail {
        position: absolute;
        left: 42px;
        right: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #92968f;
        font: 18px/1 "Departure Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .rail.top { top: 25px; }
      .rail.bottom { bottom: 22px; }
      .signal { color: #e4ccff; }
      .intro {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .intro-kicker {
        color: #e4ccff;
        font: 22px/1 "Departure Mono", monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .intro-title {
        margin-top: 24px;
        font: 92px/0.95 "Departure Mono", monospace;
        letter-spacing: -0.055em;
      }
      .intro-route {
        margin-top: 30px;
        color: #a3a7a0;
        font: 21px/1.35 "Departure Mono", monospace;
        letter-spacing: 0.04em;
      }
      .screen-shell {
        position: absolute;
        left: 140px;
        top: 68px;
        width: 1640px;
        height: 988px;
        overflow: hidden;
        background: #101719;
        border: 1px solid rgba(228, 204, 255, 0.62);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 28px 90px rgba(0,0,0,0.7);
      }
      .screen-shell video,
      .screen-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .live-badge {
        position: absolute;
        top: 84px;
        right: 158px;
        padding: 11px 15px 10px;
        color: #070806;
        background: #e4ccff;
        font: 17px/1 "Departure Mono", monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        z-index: 4;
      }
      .proof-badge {
        position: absolute;
        right: 158px;
        bottom: 42px;
        padding: 13px 17px 12px;
        color: #e4ccff;
        background: rgba(6, 7, 6, 0.94);
        border: 1px solid rgba(228, 204, 255, 0.65);
        font: 18px/1 "Departure Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="command-code-live" data-width="1920" data-height="1080" data-duration="19">
      <div id="live-intro" class="clip intro" data-start="0" data-duration="1.75" data-track-index="1">
        <div class="intro-kicker">Actual host session · recorded live</div>
        <div class="intro-title">COMMAND CODE × KUJO</div>
        <div class="intro-route">OLLAMA GLM 5.3 → MCP → ABILITY GATEWAY → KUJO</div>
      </div>

      <div id="live-shell" class="screen-shell">
        <video
          id="command-code-live-session"
          class="clip"
          src="assets/command-code-live.mp4"
          data-start="1.75"
          data-duration="12.47"
          data-track-index="2"
          muted
          playsinline
        ></video>
      </div>

      <div id="final-shell" class="clip screen-shell" data-start="14.22" data-duration="4.78" data-track-index="3">
        <img src="assets/command-code-live-final.png" alt="Final Command Code response showing a verified Kujo receipt" />
      </div>

      <div id="live-badge" class="clip live-badge" data-start="1.75" data-duration="12.47" data-track-index="4">Live Command Code</div>
      <div id="proof-badge" class="clip proof-badge" data-start="14.22" data-duration="4.78" data-track-index="5">Standard MCP · receipt verified</div>
      <audio
        id="command-code-narration"
        src="assets/narration-brian-normalized.wav"
        data-start="0.25"
        data-duration="18.204444"
        data-track-index="6"
        data-volume="0.74"
      ></audio>
      <div class="rail top"><span>Kujo Ability portability proof</span><span class="signal">01 / Live</span></div>
      <div class="rail bottom"><span>Command Code 1.53.1</span><span>Ollama / glm-5.3:cloud</span></div>
    </div>
    <script>
      window.__timelines["command-code-live"] = gsap.timeline({ paused: true })
        .fromTo("#live-shell", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.75)
        .fromTo("#live-badge", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.95)
        .fromTo("#proof-badge", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 14.22);
    </script>
  </body>
</html>
