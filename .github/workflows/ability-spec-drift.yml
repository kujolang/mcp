name: Ability plugin specification drift

on:
  schedule:
    - cron: "37 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-plugin-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare current official schemas
        shell: bash
        run: bash scripts/check-agent-plugin-spec-drift.sh
