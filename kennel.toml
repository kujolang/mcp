[build]
artifacts = []
command = ""
output = "dist"

[dependencies.ability]
commit = "2dc7d4e9eb25e987544ac48793cd11d1999c45e0"
source = "github:kujolang/ability"

[dev-dependencies]

[kujo]
entry = "server.kujo"
excludes = [".git", "kennel_packages", "dist", "build", "node_modules"]
includes = ["README.md", "demo"]
minimum_version = "1.6.0"
sources = ["."]

[package]
authors = ["Kujolang <contact@kujolang.ai>"]
categories = ["ai", "developer-tools"]
description = "A Kujo-native MCP server framework for tools, resources, and JSON-schema validated tool handlers."
documentation = ""
homepage = ""
keywords = ["kujo", "mcp", "agents", "tooling"]
license = "MIT"
name = "mcp"
readme = "README.md"
repository = "https://github.com/kujolang/mcp"
version = "1.2.0"

[package.exports]
framework = "mcp.kujo"

[package.metadata]
server_config = "mcp-server.json"

[package.status]
notes = "Stable guarded MCP framework and repo-scaffold generator with least-privilege defaults and deterministic validation."
public_api = true
stability = "stable"
stage = "production"

[policy.resolution]

[policy.source]

[registry]
index = ""
mirrors = []
publish = ""

[scripts]
demo = "kujo run server.kujo"
make = "kujo mcp make"
server = "kujo run server.kujo"

[trust]
checksum = ""
signature = ""
signing_key = ""
